
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F0F4FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>EmoSense — Emotional Wellness</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #F0F4FF;
      color: #1E293B;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
    }

    /* Thin, elegant scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* Safe area padding for notched devices */
    .h-safe-top { height: env(safe-area-inset-top, 0px); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* Card elevation levels */
    .shadow-card { box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
    .shadow-card-md { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
    .shadow-card-lg { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }

    /* Smooth emotion colour transitions */
    .emotion-transition { transition: background 0.8s ease, border-color 0.6s ease; }

    /* Bounce animation for typing indicator */
    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    .animate-bounce { animation: bounce-dot 1.2s ease infinite; }

    /* Fade up entry animation for cards */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up 0.35s ease forwards; }

    /* Line clamp utility */
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  </style>
